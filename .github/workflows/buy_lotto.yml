name: Buy lotto
on:
  schedule:
    - cron: 0 10 * * 1 # every Monday on 07:00 PM (KST)
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    name: Buy lotto
    steps:  

      - uses: actions/checkout@v3    
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt
      
      - name: Run Scripts
        run: make buy # or use 'make buy_lotto' / 'make buy_win720' for granular purchase
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Run lottery bot
        run: python controller.py # (예시: 기존에 복권을 구매하던 마지막 단계)
      - name: Keep repository active
        run: |
          echo "$(date)" > keep_alive.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add keep_alive.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Keep alive" && git push)
